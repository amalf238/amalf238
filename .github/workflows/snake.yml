name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake (TRUE DARK MODE)
        uses: Platane/snk@main
        with:
          github_user_name: amalf238
          svg_out_path: dist/snake.svg
          palette: github-dark
          color_snake: "#39D353"
          color_dots: "#238636"
          background: "#0D1117"   # GitHub dark background

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
