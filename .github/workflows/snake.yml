name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake (Dark Mode)
        uses: Platane/snk@v3
        with:
          github_user_name: amalf238
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#39D353&color_dots=#161b22
            dist/snake-light.svg?palette=github-light&color_snake=#39D353&color_dots=#9be9a8

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
